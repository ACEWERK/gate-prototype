const DEMO={name:'Alex Morgan',email:'alex@example.com',country:0,address:'Villa 12, Example Street, Dubai',source:'exchange',provider:'Example Exchange'};
const SCENARIOS=[
['a','Default','Deposit detected, payment pending compliance verification. The buyer sees Payment Processing.'],
['b','Provide additional information','After Payment Processing, select “Leave checkout / Open email”. Gate Payments asks for information through its form. Submitting returns to Payment Processing.'],
['c','Rejected','After Payment Processing, select “Refresh status”. The buyer is asked to contact customer support, quoting the payment reference.'],
['d','Refunded','After Payment Processing, select “Leave checkout / Open email”. The buyer is asked to contact customer support about the refund.']];
const initial=()=>({view:'checkout',scenario:'a',step:0,currency:0,country:0,name:'',email:'',address:'',source:'exchange',provider:'',wallet:'',third:false,sender:'',relationship:'',quoteExpires:null,deposit:'idle',outcome:'processing',submitted:false,file:null});
let state=initial(),timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coin=()=>currencies[state.currency];
const demoAddress=()=>`DEMO-${coin().token}-${coin().network.toUpperCase()}-GT1042`;
const txid=()=>`DEMO-TXID-${coin().token}-${coin().network.toUpperCase()}-GT1042`;
const field=(label,key,type='text',value=state[key]||'')=>`<div class="field"><label for="${key}">${label}</label><input id="${key}" name="${key}" type="${type}" value="${esc(value)}" required></div>`;
const button=(label,action,cls='primary',extra='')=>`<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
const nameLabel=()=>state.third?'Full legal name of the representative *':'Full legal name *';
const remaining=()=>state.quoteExpires?Math.max(0,state.quoteExpires-Date.now()):QUOTE_MS;
const expired=()=>remaining()<=0;
function hms(ms){let s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
function summary(){const buyer=state.third?state.sender:state.name;return `<aside class="card summary"><div class="eyebrow">YOUR PAYMENT</div><h2>Developer A</h2><p>Property instalment<br>Invoice INV-1042</p><div class="amount">AED 36,725.00</div><div class="line"><span>Payment reference</span><strong>GT-1042</strong></div><div class="line"><span>Payment asset</span><strong>${coin().token} · ${coin().network}</strong></div><div class="line"><span>Buyer</span><strong>${esc(buyer||'To be provided')}</strong></div><p class="muted" style="margin-top:24px;margin-bottom:0">Your payment is converted and credited to the merchant in fiat.</p></aside>`}
function render(){if(state.view==='notes')return notes();if(state.view==='presenter')return presenter();if(state.view==='email')return emailView();const body=state.view==='info'?infoForm():checkout();const cta=state.view==='checkout'&&state.step===2?`<div class="scenario-cta">${button('Check Payment Scenarios','scenarios','secondary')}</div>`:'';app.innerHTML=`<section class="card">${body}</section>${summary()}${cta}`;bind();tick();}
function checkout(){let progress=`<div class="progress"><span class="${state.step===0?'current':''}">Payment method</span><span>→</span><span class="${state.step===1?'current':''}">Your details</span><span>→</span><span class="${state.step===2?'current':''}">Send payment</span></div>`;
if(state.step===0)return progress+`<h1>Pay with stablecoins</h1><p>Choose the asset and network you’ll send from.</p><form id="currency-form">${currencies.map((c,i)=>`<label class="currency"><span class="coin"><img src="${asset(c.icon)}" alt="${c.token}"><img class="network" src="${asset(c.net)}" alt="${c.network}"></span><span><strong>${c.token}</strong><small>${c.network}</small></span><input aria-label="${c.token} on ${c.network}" type="radio" name="currency" value="${i}" ${i===state.currency?'checked':''}></label>`).join('')}<button class="primary">Continue</button></form>`;
if(state.step===1)return `<button class="back" data-action="back">← Payment method</button>`+progress+`<h1>Your payment details</h1><p>Tell us who is sending this payment.</p><form id="details">${field(nameLabel(),'name')}${field('Email address *','email','email')}<div class="field country"><label>Country of residence *</label><button type="button" class="country-toggle" id="country-toggle" aria-expanded="false"><img class="flag" src="${asset(countries[state.country][2])}" alt="">${countries[state.country][0]} <small>${countries[state.country][1]}</small><span style="margin-left:auto">⌄</span></button><div id="country-menu" class="country-menu" hidden><input aria-label="Search countries" id="country-search" placeholder="Search country or code"><div id="country-results"></div></div></div>${field('Residential address *','address')}<div class="field"><label for="source">Sending source *</label><select id="source" name="source"><option value="exchange" ${state.source==='exchange'?'selected':''}>Exchange or wallet provider</option><option value="self" ${state.source==='self'?'selected':''}>Self-custody wallet</option></select></div><div id="source-fields"></div><div class="field"><label><input style="width:auto" type="checkbox" id="third" ${state.third?'checked':''}> I am a representative sending this payment on behalf of someone else</label></div><div id="third-fields"></div><button class="primary">Continue to payment</button></form>`;
if(state.step===2)return `<button class="back" data-action="back">← Your details</button><div class="eyebrow">SEND PAYMENT</div><h1>Pay in ${coin().token}</h1><p>Use the ${coin().network} network.</p><div class="large">10,000.00 ${coin().token}</div><p class="muted">Illustrative quote · 1 ${coin().token} = 3.6725 AED</p>${quoteBlock()}<div class="notice">Prototype payment instructions. This demonstration address cannot receive payments.</div><label>Payment address</label><div class="address">${demoAddress()}</div>${button('Copy demo address','copy','secondary')}<p class="muted" style="margin-top:18px">Quote valid for 1 hour. Send the exact amount on the ${coin().network} network.</p>${depositBlock()}`;
return statusView();}
function quoteBlock(){if(state.deposit==='idle'&&expired())return `<div class="notice" id="quote-expired" role="status"><strong>Quote expired</strong><br>Refresh the quote to continue.</div>${button('Refresh quote','refresh-quote','secondary')}`;return `<p class="muted">Quote expires in <strong class="timer" id="quote-timer">${hms(remaining())}</strong></p>`}
function depositBlock(){if(state.deposit==='waiting')return `<div class="notice" role="status">Waiting for your deposit on the ${coin().network} network…</div>`;if(state.deposit==='detected')return `<div class="notice" role="status"><strong>Deposit detected</strong></div>`;return button('I’ve sent the payment','sent','primary',expired()?'disabled':'')}
function statusView(){const ref=`<div class="large">10,000.00 ${coin().token}</div><div class="line"><span>Reference</span><strong>GT-1042</strong></div>`;const demo=(label,action,cls='primary')=>`<div class="eyebrow" style="margin-top:28px;margin-bottom:0">DEMO STEP</div>${button(label,action,cls)}`;
if(state.outcome==='rejected')return `<span class="status">Unable to complete</span><h1 style="margin-top:24px">We are unable to complete this payment</h1><p>Please contact customer support regarding your payment, quoting your payment reference.</p>${ref}${button('Contact customer support','support')}`;
if(state.outcome==='refund')return `<span class="status">Contact customer support</span><h1 style="margin-top:24px">Please contact customer support</h1><p>Please contact customer support regarding your payment, quoting your payment reference.</p>${ref}${button('Contact customer support','support')}${demo('Leave checkout / Open email','email','secondary')}`;
const email=(state.scenario==='b'&&!state.submitted)||state.scenario==='d';
return `<span class="status">Deposit detected</span><h1 style="margin-top:24px">Payment Processing</h1><p>${state.submitted?'Thank you. We have received your information. Your payment is being processed.':'We have received your payment and it is being processed. We will contact you by email if we need anything further.'}</p>${ref}${button('Refresh status','refresh-status','secondary')}${email?demo('Leave checkout / Open email','email'):''}`;}
function emailView(){const refund=state.scenario==='d',to=state.email||DEMO.email,first=(state.name||DEMO.name).split(' ')[0];
const body=refund?`<p>Hello ${esc(first)},</p><p>We are unable to complete your payment with reference GT-1042.</p><p>Please contact customer support regarding the refund of your payment, quoting your payment reference.</p>${button('Contact customer support','support')}`:`<p>Hello ${esc(first)},</p><p>We need some additional information about your payment with reference GT-1042.</p><p>Please select the button below to provide it.</p>${button('Provide information','info')}`;
app.innerHTML=`<section class="card wide email"><button class="back" data-action="checkout-return">← Back to checkout</button><div class="eyebrow">DEMO INBOX · OUTSIDE CHECKOUT</div><h1>${refund?'Your payment GT-1042':'Information about your payment GT-1042'}</h1><div class="line"><span>From</span><strong>Gate Payments &lt;payments@gate.example&gt;</strong></div><div class="line"><span>To</span><strong>${esc(to)}</strong></div><div class="line" style="margin-bottom:28px"><span>Received</span><strong>Today</strong></div>${body}<p class="muted" style="margin-top:28px;margin-bottom:0">Gate Payments · Reference GT-1042</p></section>`;}
function infoForm(){return `<button class="back" data-action="email">← Back to email</button><div class="eyebrow">GATE PAYMENTS · PAYMENT INFORMATION</div><h1>Provide information about your payment</h1><p>Please complete all fields below.</p><div class="line"><span>Payment reference</span><strong>GT-1042</strong></div><div class="line"><span>Transaction ID (TXID)</span><strong style="word-break:break-all;text-align:right">${txid()}</strong></div><div class="line"><span>Amount</span><strong>10,000.00</strong></div><div class="line"><span>Currency</span><strong>${coin().token} · ${coin().network}</strong></div><form id="info-form"><div class="field"><label for="funds">Source of funds *</label><textarea id="funds" name="funds" required></textarea></div><div class="field"><label for="controls">Does the payer control the sending wallet? *</label><select id="controls" name="controls" required><option value="">Select an answer</option><option value="yes">Yes</option><option value="no">No</option></select></div><div class="field upload"><label for="evidence">Supporting document *</label><input id="evidence" type="file" accept=".pdf,.jpg,.jpeg,.png"><small>One PDF, JPG or PNG · Up to 10 MB · Sample files only</small><div id="file-list"></div></div><div class="error" role="alert" id="file-error"></div><label style="margin-top:20px"><input type="checkbox" id="declaration" required style="width:auto"> I declare that the information I have provided is accurate and complete.</label><button class="primary">Submit information</button></form>`;}
function bind(){document.querySelector('#currency-form')?.addEventListener('submit',e=>{e.preventDefault();state.currency=Number(new FormData(e.target).get('currency'));state.step=1;render()});const form=document.querySelector('#details');if(form){function save(){for(const k of ['name','email','address','provider','wallet','sender','relationship']){const el=document.getElementById(k);if(el)state[k]=el.value;}state.source=document.querySelector('#source').value;state.third=document.querySelector('#third').checked;}form.addEventListener('input',save);form.addEventListener('submit',e=>{e.preventDefault();save();state.step=2;if(!state.quoteExpires)state.quoteExpires=Date.now()+QUOTE_MS;render()});function conditional(){document.querySelector('label[for="name"]').textContent=nameLabel();document.querySelector('#source-fields').innerHTML=state.source==='exchange'?field('Sending provider *','provider'):field('Sender wallet address *','wallet');document.querySelector('#third-fields').innerHTML=state.third?field('Buyer full legal name *','sender')+field('Relationship to buyer *','relationship'):'';}conditional();document.querySelector('#source').onchange=()=>{save();conditional()};document.querySelector('#third').onchange=()=>{save();conditional();app.querySelector('.summary').outerHTML=summary()};let menu=document.querySelector('#country-menu');document.querySelector('#country-toggle').onclick=()=>{menu.hidden=!menu.hidden;document.querySelector('#country-toggle').setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)document.querySelector('#country-search').focus()};const search=document.querySelector('#country-search');function results(){let rows=countries.map((c,i)=>({c,i})).filter(x=>x.c.join(' ').toLowerCase().includes(search.value.toLowerCase()));document.querySelector('#country-results').innerHTML=rows.length?rows.map(({c,i})=>`<button type="button" data-country="${i}"><img class="flag" src="${asset(c[2])}" alt="">${c[0]}<small>${c[1]}</small></button>`).join(''):'<p>No countries found</p>';document.querySelectorAll('[data-country]').forEach(el=>el.onclick=()=>{save();state.country=Number(el.dataset.country);render();document.querySelector('#country-toggle').focus()});}search.oninput=results;search.onkeydown=e=>{if(e.key==='Escape'){menu.hidden=true;document.querySelector('#country-toggle').focus()}if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-country]')?.click()}};results();}
const info=document.querySelector('#info-form');if(info){const err=document.querySelector('#file-error');document.querySelector('#evidence').onchange=e=>{const f=e.target.files[0];const bad=f&&(!/\.(pdf|jpe?g|png)$/i.test(f.name)||f.size>10*1024*1024);state.file=bad?null:f||null;err.textContent=bad?'Choose one PDF, JPG or PNG file up to 10 MB.':'';document.querySelector('#file-list').textContent=state.file?state.file.name:''};info.onsubmit=e=>{e.preventDefault();if(!state.file){err.textContent='Attach a supporting document before submitting.';return;}state.submitted=true;state.file=null;state.view='checkout';state.step=3;render();toast('Information received. Thank you.')}}}
function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3500)}
function reset(scenario){timers.forEach(clearTimeout);timers=[];state=initial();if(scenario){Object.assign(state,DEMO);state.scenario=scenario;state.chosen=true;}window.scrollTo(0,0);render();}
function tick(){if(state.view!=='checkout'||state.step!==2||state.deposit!=='idle')return;if(expired()){if(!document.querySelector('#quote-expired'))render();return;}const el=document.querySelector('#quote-timer');if(el)el.textContent=hms(remaining());}
setInterval(tick,250);
document.addEventListener('click',async e=>{let v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;render();return;}let sc=e.target.closest('[data-scenario]');if(sc){const s=SCENARIOS.find(x=>x[0]===sc.dataset.scenario);reset(s[0]);toast(`Scenario ${s[0].toUpperCase()} · ${s[1]} started`);return;}let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;
if(a==='back'){state.step--;render()}
if(a==='copy'){try{await navigator.clipboard.writeText(demoAddress());toast('Demo address copied')}catch{toast('Select the demo address to copy it.')}}
if(a==='refresh-quote'){state.quoteExpires=Date.now()+QUOTE_MS;render()}
if(a==='sent'&&state.deposit==='idle'&&!expired()){state.deposit='waiting';render();later(()=>{state.deposit='detected';render();later(()=>{state.step=3;render()},1500)},2500)}
if(a==='scenarios'){state.view='presenter';render()}
if(a==='refresh-status'){if(state.scenario==='c'){state.outcome='rejected';render()}else toast('Your payment is still being processed.')}
if(a==='email'){state.view='email';if(state.scenario==='d')state.outcome='refund';window.scrollTo(0,0);render()}
if(a==='info'){state.view='info';state.file=null;window.scrollTo(0,0);render()}
if(a==='checkout-return'){state.view='checkout';render()}
if(a==='support'){toast('Demo support reference GT-1042. No message is sent.')}
if(a==='reset'){reset();toast('Demonstration reset')}});
document.querySelector('#help').onclick=()=>toast('Demo support reference GT-1042. No message is sent.');
function presenter(){app.innerHTML=`<section class="card wide"><div class="eyebrow">PRESENTER CONTROLS · PAYMENT SCENARIOS</div><h1>Check payment scenarios</h1><p>Choose a scenario to restart the checkout from the first step with demo data prefilled. Every step is triggered by a labelled control on screen.</p><div class="scenarios">${SCENARIOS.map(([id,title,desc])=>`<button class="scenario ${state.chosen&&state.scenario===id?'active':''}" data-scenario="${id}"><span class="eyebrow">SCENARIO ${id.toUpperCase()}</span><strong>${title}</strong><small>${desc}</small></button>`).join('')}</div>${button('Reset demonstration','reset','secondary')}</section>`;}
function notes(){app.innerHTML=`<article class="card wide notes"><div class="eyebrow">DESIGN AND REGULATORY NOTES · OUTSIDE THE CUSTOMER FLOW</div><h1>Gate checkout and information requests</h1><p>The interactive demonstration follows the proposed VARA inbound-checkout design. All amounts, identities and decisions are illustrative. Files are held in browser memory for the session. Refresh resets the prototype.</p><h2>Email and payment identity</h2><p>Email is required operationally. Validate and bind that email to the payment. Each information request is bound to GT-1042 and its recipient. Production links require authenticated or expiring access.</p><h2>VARA and UAE</h2><p>Collect originator legal name, account or wallet identifier and residential/business address. Match the beneficiary name and account/wallet to verified merchant records. VARA III.G.3 requires data before client access above AED 3,500. Cabinet Resolution 134/2025 Article 36 also requires accurate originator and beneficiary information. This design proposes collection at all values. Legal and Compliance confirm the serving entity, production thresholds, CDD and self-custody rules.</p><p><a href="https://rulebooks.vara.ae/rulebook/part-iii-anti-money-laundering-and-combating-financing-terrorism">VARA Part III</a> · <a href="https://rulebook.centralbank.ae/en/entiresection/43">UAE Cabinet Resolution 134/2025</a></p><h2>Bahrain CBB</h2><p>Volume 6 AML-2A.2 applies required information to all accepted crypto-asset transfers. Obtain originator name, account/wallet and address or a permitted alternative identifier, plus beneficiary name and account/wallet. Provider information travels immediately and securely. The traditional-wire two-business-day allowance does not apply to crypto transfers. Missing information follows the inward-transfer escalation process. For unhosted receipts, obtain required originator information from the customer.</p><p><a href="https://cbben.thomsonreuters.com/sites/default/files/net_file_store/Vol_6_AML_October_2023.pdf">CBB Volume 6 AML</a></p><h2>Release and evidence</h2><p>Receipt → Deposit processing → attribution, data and screening clearance → authorized release → sweep → conversion → merchant fiat credit. Representatives sending on behalf of a buyer are identified explicitly. Information submission preserves the hold. Compliance owns approval, decline, freeze and lawful-return eligibility. Internal reasons and reporting remain restricted. Buyer-facing messages and emails stay neutral and give no reason or timeline.</p><h2>Quotes</h2><p>The FX quote is valid for 1 hour. The send-payment step shows a live countdown and offers a refreshed quote on expiry.</p><h2>Prototype boundaries</h2><p>Country search, selection, form validation, currency/network state and evidence selection work locally. Provider messaging, KYT, identity verification, email delivery, actual file storage and money movement are simulated. Network icons and token marks are illustrative vector reproductions. Sample country coverage is intentionally limited. Use sample information only.</p></article>`;}
render();
</script></body></html>
